[package]
name = "msc-helper-gui"
version = "0.1.0"
edition = "2021"
description = "MSC Helper GUI (Rust / egui) – talks to the Python backend"
authors = ["MSC Helper"]

[dependencies]
eframe = { version = "=0.27.2", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = "=0.27.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", default-features = false, features = ["json", "tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
